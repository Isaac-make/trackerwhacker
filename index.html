<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Trackerwhacker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: sticky top bar with tabs, one view at a time; cards in a responsive grid. Single dark look by choice: deep green-black with green for money in, red for money out. */
:root {
  color-scheme: dark;
  --bg: #0b1310;
  --surface: #121d18;
  --surface-2: #182620;
  --line: #24362d;
  --fg: #e4eee8;
  --muted: #8ea79a;
  --green: #3ec27f;
  --green-dim: #1d4a33;
  --red: #ef5b52;
  --red-dim: #4a1f1d;
  --amber: #e6a63c;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 0; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .02em; text-transform: uppercase; }
.brand span { color: var(--green); }
.status { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.ok .dot { background: var(--green); }
.status.warn .dot { background: var(--amber); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px 0; scrollbar-width: none; }
nav.tabs a { color: var(--muted); text-decoration: none; padding: 8px 14px; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a:hover { color: var(--fg); }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--green); }
main { padding-block: 20px 60px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; letter-spacing: .05em; text-transform: uppercase; margin: 0 0 12px; color: var(--fg); }
.sub { color: var(--muted); font-size: .9rem; margin: 2px 0 0; }
.view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
@media (max-width: 900px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 720px) { .g2 { grid-template-columns: minmax(0,1fr); } .span2 { grid-column: auto; } }
@media (max-width: 420px) { .g4 { grid-template-columns: minmax(0,1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.kpi .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kpi .value { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; line-height: 1.1; font-variant-numeric: tabular-nums; margin-top: 4px; }
.kpi .note { font-size: .82rem; color: var(--muted); margin-top: 4px; }
.pos { color: var(--green); } .neg { color: var(--red); } .warn-t { color: var(--amber); }
.chart-box { position: relative; height: 260px; }
.chart-box.tall { height: 320px; }
.chart-box.short { height: 220px; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface-2); border: 1px dashed var(--amber); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: .9rem; }
.banner b { color: var(--amber); }
button, .btn { font: inherit; font-weight: 600; font-size: .9rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--green); border-color: var(--green); color: #06130c; }
button.primary:hover { filter: brightness(1.1); }
button.danger { color: var(--red); }
button.ghost { background: transparent; }
button.small { padding: 4px 10px; font-size: .8rem; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; min-width: 0; width: 100%; font-variant-numeric: tabular-nums; }
input:hover, select:hover { border-color: var(--muted); }
label.f { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; min-width: 0; }
.money { position: relative; }
.money::before { content: "£"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.money input { padding-left: 22px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1 1 120px; }
.row > button { flex: 0 0 auto; }
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-nav .m { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; min-width: 150px; text-align: center; text-transform: uppercase; letter-spacing: .03em; }
.cat-list { display: grid; gap: 10px; }
.cat { display: grid; grid-template-columns: 14px minmax(0, 1.4fr) minmax(90px, 1fr) minmax(90px, 1fr) 28px; gap: 10px; align-items: center; }
.cat .sw { width: 12px; height: 12px; border-radius: 3px; }
.cat .name { font-weight: 600; overflow-wrap: anywhere; }
.cat .name small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
.cat .bar { grid-column: 2 / 5; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: -4px; }
.cat .bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.cat .bar.warn i { background: var(--amber); }
.cat .bar.over i { background: var(--red); }
.cat-head { display: grid; grid-template-columns: 14px minmax(0, 1.4fr) minmax(90px, 1fr) minmax(90px, 1fr) 28px; gap: 10px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
@media (max-width: 520px) {
  .cat, .cat-head { grid-template-columns: 12px minmax(0,1fr) 88px 80px 24px; gap: 6px; }
}
.x { background: none; border: none; color: var(--muted); padding: 2px 6px; font-size: 1rem; cursor: pointer; }
.x:hover { color: var(--red); }
.x.confirm { color: var(--red); font-size: .72rem; font-weight: 700; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.r, th.r { text-align: right; }
.scroll-y { max-height: 320px; overflow-y: auto; }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.pill.g { background: var(--green-dim); color: var(--green); }
.pill.r { background: var(--red-dim); color: var(--red); }
.pill.a { background: #4a3a1a; color: var(--amber); }
.meter { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; margin: 8px 0 4px; }
.meter i { display: block; height: 100%; background: var(--green); }
.meter.over i { background: var(--red); }
.legend-list { display: grid; gap: 6px; margin-top: 10px; font-size: .85rem; }
.legend-list div { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.legend-list span.k { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend-list .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.legend-list b { font-variant-numeric: tabular-nums; font-weight: 600; }
.disclaimer { font-size: .8rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin-top: 12px; }
.ring { display: flex; align-items: center; gap: 16px; }
.ring svg { flex: none; }
.empty { color: var(--muted); font-size: .9rem; padding: 20px 0; text-align: center; }
.stack { display: grid; gap: 12px; }
.hint { font-size: .82rem; color: var(--muted); }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type=range] { padding: 0; accent-color: var(--green); border: none; background: transparent; }
.range-row output { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 64px; text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; border-radius: 0; background: transparent; color: var(--muted); padding: 6px 12px; }
.seg button[aria-pressed="true"] { background: var(--green-dim); color: var(--green); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pill.b { background: #1b3346; color: #6db8ea; }
.pill.n { background: var(--surface-2); color: var(--muted); }
.pot-facts { display: grid; gap: 2px; margin-top: 10px; font-size: .88rem; }
.pot-facts b { font-variant-numeric: tabular-nums; }
details.more { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: .85rem; font-weight: 600; }
details.more summary:hover { color: var(--fg); }
details.more[open] summary { margin-bottom: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--fg); }
.check input { width: auto; accent-color: var(--green); }
.ro { opacity: .75; cursor: not-allowed; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--line); padding: 8px 16px; border-radius: 8px; font-size: .88rem; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
/* Phones: the header scrolls away with the page instead of covering it */
@media (max-width: 720px) {
  header.top { position: static; }
  .brand { font-size: 1.25rem; }
  .topbar { padding-block: 10px 0; gap: 8px; }
  .top-right { width: 100%; justify-content: space-between; }
  .top-right .seg button { padding: 6px 10px; }
  nav.tabs a { padding: 8px 10px; font-size: .95rem; }
}
.gear { color: var(--muted); text-decoration: none; font-size: .85rem; font-weight: 600; }
.gear:hover { color: var(--fg); }
.gate { max-width: 520px; margin: 40px auto; }
.who-note { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: .9rem; }
.ro-mode main form, .ro-mode main details.more, .ro-mode main .x, .ro-mode main [data-act], .ro-mode main [data-live], .ro-mode main [data-repeat], .ro-mode main .hint.live-hint { display: none !important; }
label.btn { display: inline-flex; align-items: center; cursor: pointer; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Tracker<span>whacker</span></div>
      <div class="top-right">
        <div class="seg" id="whoSeg" role="group" aria-label="Whose money" hidden></div>
        <a href="#settings" class="gear" id="gearLink" hidden>Settings</a>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">Loading…</span></div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#month" data-view="month">Monthly</a>
      <a href="#wealth" data-view="wealth">Savings &amp; Bonds</a>
      <a href="#sp500" data-view="sp500">S&amp;P &amp; Gold</a>
      <a href="#gifts" data-view="gifts">Presents</a>
      <a href="#progress" data-view="progress">Progress</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
"use strict";

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(String(v).replace(/[£,%\s]/g, "")); return isFinite(n) ? n : 0; };
const gbp = (n, dp = 2) => (n < 0 ? "−£" : "£") + Math.abs(n).toLocaleString("en-GB", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const gbp0 = n => gbp(n, 0);
const pct = n => (n >= 0 ? "+" : "−") + Math.abs(n).toFixed(1) + "%";
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, "0");
const isoDate = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayISO = () => isoDate(new Date());
const monthKey = d => (typeof d === "string" ? d.slice(0, 7) : d.getFullYear() + "-" + pad(d.getMonth() + 1));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthLabel = (k, long) => { const [y, m] = k.split("-").map(Number); return (long ? ["January","February","March","April","May","June","July","August","September","October","November","December"][m-1] : MONTHS[m-1]) + " " + (long ? y : String(y).slice(2)); };
const shiftMonth = (k, n) => { const [y, m] = k.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return monthKey(d); };
const monthEnd = k => { const [y, m] = k.split("-").map(Number); return isoDate(new Date(y, m, 0)); };
const shortDate = s => { const [y, m, d] = s.split("-").map(Number); return d + " " + MONTHS[m-1] + " " + String(y).slice(2); };
const addMonthsISO = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return isoDate(new Date(y, m - 1 + n, d)); };
const daysUntil = iso => { const a = new Date(todayISO() + "T00:00:00"), b = new Date(iso + "T00:00:00"); return Math.round((b - a) / 864e5); };
const monthsBetween = (fromIso, toIso) => { const [y1, m1] = fromIso.split("-").map(Number), [y2, m2] = toIso.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const PALETTE = ["#3ec27f","#ef5b52","#e6a63c","#4fa3d9","#b07fe0","#2fc4b2","#f07a9a","#9cc34a","#d98a4f","#7c8cf0","#c9b458","#5fd4e6","#e07fc8","#8fbf9f"];
const POT_PALETTE = ["#3ec27f","#9cc34a","#4fa3d9","#b07fe0","#2fc4b2","#7c8cf0","#d98a4f","#e07fc8","#c9b458"];
const TYPES = {
  savings: { label: "Savings", color: "#3ec27f" },
  regular: { label: "Regular saver", color: "#9cc34a" },
  bonds: { label: "Bonds", color: "#4fa3d9" },
  other: { label: "Other investments", color: "#b07fe0" }
};
const PLAN_DEFAULT = () => ({ monthly: 700, start: shiftMonth(monthKey(new Date()), -5), startValue: "", growth: 4 });
const CASH_COL = "#5fd4e6";
const HOLD_PALETTE = ["#f08a4b", "#f5d061", "#e07fc8", "#7c8cf0", "#2fc4b2", "#c9b458"];
const sglnBlank = () => ({ id: "sgln", name: "iShares Physical Gold (SGLN)", short: "Gold (SGLN)", ticker: "SGLN.L", color: "#f5d061", buys: [], currentPrice: 0, priceDate: todayISO() });

/* ---------- example data ---------- */
function baseCategories() {
  return [
    { id: "fuel", name: "Fuel", budget: 180 },
    { id: "food", name: "Food shop", budget: 250 },
    { id: "eatout", name: "Eating out", budget: 120 },
    { id: "bday", name: "Birthday presents", budget: 40, linked: "birthday" },
    { id: "xmas", name: "Christmas presents", budget: 60, linked: "christmas" },
    { id: "cartax", name: "Car tax", budget: 16, fixed: true },
    { id: "carins", name: "Car insurance", budget: 58, fixed: true },
    { id: "wifi", name: "WiFi", budget: 32, fixed: true },
    { id: "phone", name: "Phone bill", budget: 25, fixed: true }
  ];
}
function exampleState() {
  const months = {};
  const now = monthKey(new Date());
  const plan = [
    // [base, op, other, saved, fuel, food, eatout]
    [2380, 0,   0,  400, 168, 241, 96],
    [2380, 0,  45,  450, 191, 262, 134],
    [2380, 690, 0,  900, 42,  88,  38],
    [2380, 740, 0,  950, 35,  92,  22],
    [2380, 720, 0,  900, 48,  95,  41],
    [2380, 0,   0,  450, 112, 154, 61]
  ];
  plan.forEach((p, i) => {
    const k = shiftMonth(now, i - 5);
    months[k] = { income: { base: p[0], op: p[1], other: p[2] }, saved: p[3],
      spend: { fuel: p[4], food: p[5], eatout: p[6], cartax: 15.75, carins: 57.4, wifi: 32, phone: 24.5 } };
  });
  const endOf = i => { const e = monthEnd(shiftMonth(now, i - 5)); return e > todayISO() ? todayISO() : e; };
  const grow = (start, step) => Array.from({ length: 6 }, (_, i) => ({ date: endOf(i), value: Math.round(start + step * i + (i >= 2 ? step * 0.6 * Math.min(i - 1, 3) : 0)) }));
  const regStart = shiftMonth(now, -5) + "-01";
  const fixStart = monthEnd(shiftMonth(now, -4));
  // weekly S&P buys over ~22 weeks with a gentle random walk on price
  const buys = []; let price = 101.4; const start = new Date(); start.setDate(start.getDate() - 7 * 22);
  const wiggle = [0.6,-0.4,1.1,0.3,-1.2,0.8,0.5,-0.2,1.4,-0.9,0.7,0.2,-1.6,-0.5,1.0,1.3,0.4,-0.3,0.9,0.6,-0.7,0.8];
  for (let i = 0; i < 22; i++) { const d = new Date(start); d.setDate(d.getDate() + 7 * i); price = +(price + wiggle[i]).toFixed(2); buys.push({ id: uid(), date: isoDate(d), amount: i >= 8 && i < 20 ? 75 : 50, price, fromCash: true }); }
  // fortnightly gold buys over ~20 weeks
  const gold = []; let gp = 52.6; const gw = [0.8, -0.5, 1.4, 0.9, -1.1, 1.6, 0.4, -0.3, 1.2, 0.7];
  for (let i = 0; i < 10; i++) { const d = new Date(start); d.setDate(d.getDate() + 14 + 14 * i); gp = +(gp + gw[i]).toFixed(2); gold.push({ id: uid(), date: isoDate(d), amount: 25, price: gp, fromCash: true }); }
  const yr = new Date().getFullYear();
  return {
    v: 1, example: true,
    categories: baseCategories(), months,
    pots: [
      { id: uid(), name: "Easy-access saver", type: "savings", rate: 4.1, fixedUntil: "", history: grow(3000, 260) },
      { id: uid(), name: "Regular saver", type: "regular", rate: 8, monthly: 200, start: regStart, term: 12,
        history: Array.from({ length: 6 }, (_, i) => ({ date: endOf(i), value: Math.round(200 * (i + 1) * (1 + 0.08 * i / 24)) })) },
      { id: uid(), name: "1-year fixed bond", type: "bonds", rate: 4.6, fixedUntil: addMonthsISO(fixStart, 12), history: [{ date: fixStart, value: 2000 }] },
      { id: uid(), name: "Premium Bonds", type: "bonds", rate: 3.6, fixedUntil: "", history: grow(500, 100) },
      { id: uid(), name: "Stocks & shares ISA", type: "other", rate: 0, fixedUntil: "", history: grow(2600, 85) }
    ],
    goal: { name: "House deposit", target: 20000 },
    sp: { holdings: [
        { id: "sp500", name: "Vanguard S&P 500 UCITS ETF (VUSA, Dist)", short: "S&P 500 (VUSA)", ticker: "VUSA.L", color: "#f08a4b", buys, currentPrice: +(price + 0.9).toFixed(2), priceDate: todayISO() },
        { ...sglnBlank(), buys: gold, currentPrice: +(gp + 0.6).toFixed(2) }
      ],
      cash: { rate: 3.75, history: [{ date: endOf(3), value: 180 }, { date: todayISO(), value: 95.4 }] } },
    forecast: { years: 10, monthly: 500, rate: 7 },
    plan: PLAN_DEFAULT(),
    gifts: [
      { id: uid(), name: "Mum", type: "birthday", date: yr + "-08-14", budget: 50, spent: 60, bought: shiftMonth(now, -3) + "-08" },

// GitHub locations. The site lives in SITE_REPO (public); the encrypted data lives in DATA_REPO (private).
const OWNER = "Isaac-make", SITE_REPO = "trackerwhacker", DATA_REPO = "trackerwhacker";

let ui = { view: "overview", month: monthKey(new Date()), open: new Set(), hold: "sp500", who: lsGet("tw-who") || "", live: {} };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function setStatus(kind, text) { const s = $("#status"); if (!s) return; s.className = "status " + kind; $("#statusText").textContent = text; }

/* ---------- calculations ---------- */
const monthData = k => state.months[k] || { income: { base: 0, op: 0, other: 0 }, saved: 0, spend: {} };
const ensureMonth = k => { if (!state.months[k]) state.months[k] = { income: { base: 0, op: 0, other: 0 }, saved: 0, spend: {} }; return state.months[k]; };
const incomeOf = m => num(m.income.base) + num(m.income.op) + num(m.income.other);
const giftSpent = (type, k) => state.gifts.filter(g => g.type === type && g.bought && g.bought.startsWith(k)).reduce((t, g) => t + num(g.spent), 0);
const catSpend = (c, k) => c.linked ? giftSpent(c.linked, k) : num(monthData(k).spend[c.id]);
const spendOf = k => state.categories.reduce((t, c) => t + catSpend(c, k), 0);
const catColor = (c, i) => c.color || PALETTE[i % PALETTE.length];
const potColor = i => POT_PALETTE[i % POT_PALETTE.length];
const latestAt = (list, date) => { let v = 0, best = ""; (list || []).forEach(e => { if (e.date <= date && e.date >= best) { best = e.date; v = num(e.value); } }); return v; };
const endFor = k => k === monthKey(new Date()) ? todayISO() : monthEnd(k);
function holdStats(h, upTo) {
  const buys = [...h.buys].filter(b => !upTo || b.date <= upTo).sort((a, b) => a.date.localeCompare(b.date));
  let shares = 0, paid = 0, lastPrice = 0;
  buys.forEach(b => { if (num(b.price) > 0) { shares += num(b.amount) / num(b.price); lastPrice = num(b.price); } paid += num(b.amount); });
  const price = num(h.currentPrice) || lastPrice;
  return { buys, shares, paid, lastPrice, avg: shares ? paid / shares : 0, price, value: shares * price };
}
function spValueNow() {
  const per = state.sp.holdings.map(h => ({ h, st: holdStats(h) }));
  const value = per.reduce((t, x) => t + x.st.value, 0), paid = per.reduce((t, x) => t + x.st.paid, 0);
  const buyCount = per.reduce((t, x) => t + x.st.buys.length, 0);
  const cash = latestAt(state.sp.cash.history, todayISO());
  return { per, value, paid, buyCount, cash, cashRate: num(state.sp.cash.rate), total: value + cash };
}
const potBalance = (p, date = todayISO()) => latestAt(p.history, date);
function potInfo(p) {
  const bal = potBalance(p), r = num(p.rate) / 100;
  const info = { bal, yearly: bal * r, status: "easy", end: "", daysLeft: 0, atEnd: 0, paymentsLeft: 0 };
  if (p.type === "regular" && p.start && num(p.term)) {
    info.end = addMonthsISO(p.start, num(p.term));
    info.daysLeft = daysUntil(info.end);
    const made = Math.max(0, Math.min(num(p.term), monthsBetween(p.start, todayISO()) + 1));
    info.paymentsLeft = Math.max(0, num(p.term) - made);
    const mLeft = Math.max(0, monthsBetween(todayISO(), info.end));
    let v = bal; const rm = r / 12;
    for (let i = 1; i <= mLeft; i++) { v = v * (1 + rm) + (i <= info.paymentsLeft ? num(p.monthly) : 0); }
    info.atEnd = v;
    info.status = info.daysLeft > 0 ? "running" : "ended";
  } else if (p.fixedUntil) {
    info.end = p.fixedUntil; info.daysLeft = daysUntil(p.fixedUntil);
    info.atEnd = bal * Math.pow(1 + r, Math.max(0, info.daysLeft) / 365);
    info.status = info.daysLeft > 0 ? "locked" : "unlocked";
  }
  return info;
}
function wealthNow() {
  const byType = { savings: 0, regular: 0, bonds: 0, other: 0 };
  state.pots.forEach(p => { byType[p.type] = (byType[p.type] || 0) + potBalance(p); });
  const sp = spValueNow();
  const total = Object.values(byType).reduce((a, b) => a + b, 0) + sp.value + sp.cash;
  return { byType, sp: sp.value, per: sp.per, cash: sp.cash, total };
}
function allMonthKeys() {
  const keys = new Set(Object.keys(state.months));
  state.pots.forEach(p => p.history.forEach(e => keys.add(monthKey(e.date))));
  state.sp.holdings.forEach(h => h.buys.forEach(b => keys.add(monthKey(b.date))));
  state.sp.cash.history.forEach(e => keys.add(monthKey(e.date)));
  keys.add(monthKey(new Date()));
  const sorted = [...keys].sort();
  const out = []; let k = sorted[0]; const last = sorted[sorted.length - 1];
  while (k <= last && out.length < 240) { out.push(k); k = shiftMonth(k, 1); }
  return out;
}
function activityMonths() {
  const keys = new Set(Object.keys(state.months));
  state.gifts.forEach(g => { if (g.bought && num(g.spent)) keys.add(monthKey(g.bought)); });
  return [...keys].sort();
}
function holdValueAt(h, k) { const s = holdStats(h, endFor(k)); const price = k === monthKey(new Date()) ? (num(h.currentPrice) || s.lastPrice) : s.lastPrice; return s.shares * price; }
function spSharesAt(k) { return state.sp.holdings.reduce((t, h) => t + holdValueAt(h, k), 0); }
function netWorthAt(k) {
  const end = endFor(k);
  return state.pots.reduce((t, p) => t + potBalance(p, end), 0) + spSharesAt(k) + latestAt(state.sp.cash.history, end);
}

const charts = [];

function mkChart(id, cfg) {

// Draws the % share on each pie / doughnut slice
const slicePct = {
  id: "slicePct",
  afterDatasetsDraw(chart) {
    if (chart.config.type !== "pie" && chart.config.type !== "doughnut") return;
    const ds = chart.data.datasets[0]; if (!ds) return;
    const meta = chart.getDatasetMeta(0);
    const total = ds.data.reduce((a, b, i) => a + (chart.getDataVisibility(i) ? b : 0), 0);
    if (!total) return;
    const ctx = chart.ctx; ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 12px Barlow, system-ui, sans-serif";
    meta.data.forEach((arc, i) => {
      if (!chart.getDataVisibility(i)) return;
      const p = ds.data[i] / total * 100;
      if (p < 4) return;
      const pos = arc.tooltipPosition();
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(6,19,12,.55)"; ctx.fillStyle = "#ffffff";
      const t = Math.round(p) + "%";
      ctx.strokeText(t, pos.x, pos.y); ctx.fillText(t, pos.x, pos.y);
    });
    ctx.restore();
  }
};
if (window.Chart) {
  Chart.register(slicePct);

}
const moneyTick = { callback: v => "£" + Number(v).toLocaleString("en-GB", { maximumFractionDigits: 0 }) };
const moneyTip = { callbacks: { label: ctx => " " + (ctx.dataset.label ? ctx.dataset.label + ": " : "") + gbp(ctx.parsed.y) } };
const pieTip = { callbacks: { label: ctx => { const t = ctx.dataset.data.reduce((a, b) => a + b, 0); return " " + ctx.label + ": " + gbp(ctx.parsed) + " (" + (t ? (ctx.parsed / t * 100).toFixed(1) : 0) + "%)"; } } };

const fWeeklyAmt = f => fMonthly(f) * 12 / 52;
function forecastSeries(start, weekly, ratePct, years) {
  const rw = Math.pow(1 + ratePct / 100, 1 / 52) - 1;
  const weeks = Math.round(52 * years);
  const step = years <= 1 ? 52 / 12 : 52;
  const out = [start]; let v = start, nextMark = step;
  for (let w = 1; w <= weeks; w++) { v = v * (1 + rw) + weekly; if (w >= nextMark - 0.01) { out.push(v); nextMark += step; } }
  return out;
}

  if (!last) return todayISO();

}

/* ----- Progress: plan vs actual ----- */
const plannedFor = k => { const m = state.months[k]; return m && m.planned !== undefined && m.planned !== "" && m.planned !== null ? num(m.planned) : num(state.plan.monthly); };
function planSeries() {
  const p = state.plan, now = monthKey(new Date());
  const start = p.start && p.start <= now ? p.start : now;
  const months = []; let k = start;
  while (k <= now && months.length < 240) { months.push(k); k = shiftMonth(k, 1); }
  const auto = p.startValue === "" || p.startValue === null || p.startValue === undefined;
  const startVal = auto ? netWorthAt(start) : num(p.startValue);
  const g = num(p.growth) / 1200;
  let e = startVal;
  const exp = [], act = [], planned = [], saved = [];
  months.forEach((mk, i) => {
    const pl = plannedFor(mk);
    if (i > 0) e = e * (1 + g) + pl;
    exp.push(e); act.push(netWorthAt(mk)); planned.push(pl); saved.push(num(monthData(mk).saved));
  });
  // look 12 months ahead: the plan carrying on, and your recent pace carrying on
  const recent = saved.slice(-3).filter(v => v > 0);
  const pace = recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : 0;
  const fut = [], futExp = [], futPace = [];
  let fe = exp[exp.length - 1], fp = act[act.length - 1];
  for (let i = 1; i <= 12; i++) { const fk = shiftMonth(now, i); fe = fe * (1 + g) + num(p.monthly); fp = fp * (1 + g) + pace; fut.push(fk); futExp.push(fe); futPace.push(fp); }
  return { months, exp, act, planned, saved, startVal, auto, pace, fut, futExp, futPace };
}

  let running = 0;

  return `${exampleBanner()}
  <div class="view-head"><div><h2>Plan vs Actual</h2><p class="sub">Set what you mean to save or invest each month, then see whether your real savings are keeping up.</p></div></div>

function confirmFirst(btn) {

  if (confirmBtn) { confirmBtn.textContent = confirmText; confirmBtn.classList.remove("confirm"); }
  confirmBtn = btn; confirmText = btn.textContent; btn.textContent = btn.classList.contains("x") ? "Remove?" : "Tap again to delete"; btn.classList.add("confirm");
  setTimeout(() => { if (confirmBtn === btn) { btn.textContent = confirmText; btn.classList.remove("confirm"); confirmBtn = null; } }, 3000);
  return false;
}

/* ---------- encryption (AES-GCM, key from the household passphrase) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function toB64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }

const keyCache = new Map();
async function deriveKey(pass, salt) {
  const ck = pass + "|" + salt; if (keyCache.has(ck)) return keyCache.get(ck);
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);

}
async function encryptJSON(obj, pass, salt) {
  salt = salt || toB64(crypto.getRandomValues(new Uint8Array(16)));
  const key = await deriveKey(pass, salt), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj)));
  return { v: 1, salt, iv: toB64(iv), ct: toB64(new Uint8Array(ct)) };
}
async function decryptJSON(box, pass) {
  const key = await deriveKey(pass, box.salt);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(box.iv) }, key, fromB64(box.ct));
  return JSON.parse(td.decode(pt));
}

/* ---------- GitHub storage ---------- */
let TOKEN = "", PASS = "", CONFIG = null;
const SHA = {}, SALT = {}, dirty = {};
let flushTimer = null, flushing = false, pendingRender = false, tokenProblem = false;
async function gh(path, opts = {}, token = TOKEN) {
  return fetch("https://api.github.com" + path, { ...opts, cache: "no-store", headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
}
async function readFile(repo, path, token) {
  const r = await gh(`/repos/${OWNER}/${repo}/contents/${path}`, {}, token);
  if (r.status === 404) return null;
  if (r.status === 401) throw { code: "token" };
  if (!r.ok) throw { code: "net", status: r.status };
  const j = await r.json();
  return { sha: j.sha, text: td.decode(fromB64(j.content.replace(/\n/g, ""))) };
}
async function writeFile(repo, path, text, sha, msg, token) {
  const body = { message: msg, content: toB64(te.encode(text)) }; if (sha) body.sha = sha;
  const r = await gh(`/repos/${OWNER}/${repo}/contents/${path}`, { method: "PUT", body: JSON.stringify(body) }, token);
  if (r.status === 409 || r.status === 422) throw { code: "conflict" };
  if (r.status === 401) throw { code: "token" };
  if (r.status === 403 || r.status === 404) throw { code: "forbidden" };
  if (!r.ok) throw { code: "net", status: r.status };
  return (await r.json()).content.sha;
}
const personFile = id => "person-" + id + ".json";
async function writeEnc(path, obj) {
  const box = await encryptJSON(obj, PASS, SALT[path]); SALT[path] = box.salt;
  const text = JSON.stringify(box);
  try { SHA[path] = await writeFile(DATA_REPO, path, text, SHA[path], "Update " + path); }
  catch (e) {
    if (e.code !== "conflict") throw e;
    const cur = await readFile(DATA_REPO, path); SHA[path] = cur ? cur.sha : undefined;   // someone saved at the same moment; ours is newer
    SHA[path] = await writeFile(DATA_REPO, path, text, SHA[path], "Update " + path);
  }
}
function cacheLocal() { if (lsGet("tw-pass")) lsSet("tw-cache", JSON.stringify({ HH, P })); }
function save() {
  if (ui.who === "all" || !P[ui.who]) return;
  dirty[ui.who] = true; cacheLocal();
  setStatus("warn", "Saving…");
  clearTimeout(flushTimer); flushTimer = setTimeout(flushAll, 1200);
}
function saveHousehold() { dirty.__hh = true; cacheLocal(); setStatus("warn", "Saving…"); clearTimeout(flushTimer); flushTimer = setTimeout(flushAll, 600); }
async function flushAll() {
  if (flushing) { flushTimer = setTimeout(flushAll, 800); return; }
  flushing = true;
  try {
    for (const id of Object.keys(dirty)) {
      if (!dirty[id]) continue;
      dirty[id] = false;
      try { if (id === "__hh") await writeEnc("household.json", HH); else await writeEnc(personFile(id), P[id]); }
      catch (e) { dirty[id] = true; throw e; }
    }
    setStatus("ok", "Saved and shared");
  } catch (e) {
    if (e.code === "token" || e.code === "forbidden") { tokenProblem = true; setStatus("warn", "Not saved: access token problem"); render(); }

  }

}
async function pull() {
  if (!TOKEN || flushing || Object.values(dirty).some(Boolean)) return;
  let changed = false;
  try {
    const hf = await readFile(DATA_REPO, "household.json");
    if (hf && hf.sha !== SHA["household.json"]) { const box = JSON.parse(hf.text); HH = await decryptJSON(box, PASS); SALT["household.json"] = box.salt; SHA["household.json"] = hf.sha; changed = true; }
    for (const p of HH.people) {
      const path = personFile(p.id);
      const f = await readFile(DATA_REPO, path);
      if (Object.values(dirty).some(Boolean)) return;   // a local edit started while we were reading
      if (f && f.sha !== SHA[path]) { const box = JSON.parse(f.text); P[p.id] = prepare(await decryptJSON(box, PASS)); SALT[path] = box.salt; SHA[path] = f.sha; changed = true; }
      if (!P[p.id]) { P[p.id] = freshPerson(); changed = true; }
    }
    if (!flushing && !Object.values(dirty).some(Boolean)) setStatus("ok", "Up to date");
  } catch (e) {
    if (e.code === "token") { tokenProblem = true; setStatus("warn", "Access token problem"); changed = true; }
    else setStatus("warn", "Offline: showing this device's copy");
  }

}

const personName = id => ((HH.people.find(p => p.id === id) || {}).name) || "Person";

}
function mergeStates() {

  out.sp = { holdings: [], cash: { rate: 0, history: [] } };
  const keyOf = n => String(n || "").trim().toLowerCase();
  const cats = new Map();
  ids.forEach(id => P[id].categories.forEach(c => {
    const k = keyOf(c.name);
    if (!cats.has(k)) { const nc = { ...c, id: "m" + cats.size }; cats.set(k, nc); out.categories.push(nc); }
    else cats.get(k).budget = num(cats.get(k).budget) + num(c.budget);
  }));
  const monthKeys = new Set(); ids.forEach(id => Object.keys(P[id].months).forEach(k => monthKeys.add(k)));
  monthKeys.forEach(k => {
    const om = { income: { base: 0, op: 0, other: 0 }, saved: 0, spend: {}, planned: 0 };
    ids.forEach(id => {
      const s = P[id], m = s.months[k];

      s.categories.forEach(c => { if (m.spend[c.id] !== undefined) { const nc = cats.get(keyOf(c.name)); om.spend[nc.id] = num(om.spend[nc.id]) + num(m.spend[c.id]); } });
    });

    P[id].gifts.forEach(g => out.gifts.push({ ...g, id: id + g.id, name: g.name + " (" + who + ")" }));
    P[id].pots.forEach(p => out.pots.push({ ...p, id: id + p.id, name: p.name + " · " + who }));

  ids.forEach(id => P[id].sp.holdings.forEach(h => {
    const k = (h.ticker || "").trim().toUpperCase() || (id + ":" + h.id);
    if (!holds.has(k)) { const nh = { ...h, id: "j" + holds.size, buys: [...h.buys] }; holds.set(k, nh); out.sp.holdings.push(nh); }
    else { const nh = holds.get(k); nh.buys = nh.buys.concat(h.buys); if ((h.priceDate || "") > (nh.priceDate || "") && num(h.currentPrice)) { nh.currentPrice = h.currentPrice; nh.priceDate = h.priceDate; } }
  }));
  const dates = new Set(); ids.forEach(id => P[id].sp.cash.history.forEach(e => dates.add(e.date)));
  out.sp.cash.history = [...dates].sort().map(d => ({ date: d, value: ids.reduce((t, id) => t + latestAt(P[id].sp.cash.history, d), 0) }));
  const cashNow = ids.map(id => latestAt(P[id].sp.cash.history, todayISO())), cashTot = cashNow.reduce((a, b) => a + b, 0);
  out.sp.cash.rate = cashTot ? +ids.reduce((t, id, i) => t + cashNow[i] * num(P[id].sp.cash.rate), 0) / cashTot : 0;
  out.sp.cash.rate = +out.sp.cash.rate.toFixed(2);
  const starts = ids.map(id => P[id].plan.start).filter(Boolean).sort();
  const manual = ids.every(id => P[id].plan.startValue !== "" && P[id].plan.startValue !== null && P[id].plan.startValue !== undefined);
  out.plan = { monthly: ids.reduce((t, id) => t + num(P[id].plan.monthly), 0), start: starts[0] || monthKey(new Date()), startValue: manual ? ids.reduce((t, id) => t + num(P[id].plan.startValue), 0) : "", growth: ids.length ? ids.reduce((t, id) => t + num(P[id].plan.growth), 0) / ids.length : 4 };
  out.goal = { name: "Household goal", target: ids.reduce((t, id) => t + num(P[id].goal.target), 0) };
  out.forecast = { ...(P[ids[0]] || out).forecast, monthly: ids.reduce((t, id) => t + fMonthly(P[id].forecast), 0) };
  return out;
}
function renderWho() {
  const seg = $("#whoSeg"); if (!seg) return;
  const unlocked = !!TOKEN;
  seg.hidden = !unlocked || HH.people.length < 2; $("#tabs").hidden = !unlocked; $("#gearLink").hidden = !unlocked;
  if (!unlocked) return;
  seg.innerHTML = HH.people.map(p => `<button type="button" data-who="${p.id}" id="who-${p.id}" aria-pressed="${ui.who === p.id}">${esc(p.name)}</button>`).join("") +
    `<button type="button" data-who="all" id="who-all" aria-pressed="${ui.who === "all"}">Together</button>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-who]"); if (!b) return;
  ui.who = b.dataset.who; lsSet("tw-who", ui.who); ui.live = {}; render();
});

/* ---------- live prices: prices.json is refreshed by a GitHub job every 30 minutes ---------- */
let PRICES = null, liveBusy = false;
async function loadPrices() {
  const f = await readFile(SITE_REPO, "prices.json");
  PRICES = f ? JSON.parse(f.text) : { quotes: {} };
  return PRICES;
}
async function addTicker(sym) {
  const f = await readFile(SITE_REPO, "tickers.json");
  const list = f ? JSON.parse(f.text) : [];
  if (list.map(t => t.toUpperCase()).includes(sym.toUpperCase())) return;
  list.push(sym);
  await writeFile(SITE_REPO, "tickers.json", JSON.stringify(list, null, 2) + "\n", f && f.sha, "Add " + sym + " to price list");
}
function quoteTime(q) { try { const d = new Date(q.time); return d.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
async function liveUpdate(list) {
  if (liveBusy || !list.length || ui.who === "all") return;
  liveBusy = true;
  list.forEach(h => { ui.live[h.id] = { busy: true, msg: "Fetching…" }; });
  render();
  let changed = false;
  try {
    await loadPrices();
    for (const h of list) {
      const sym = (h.ticker || "").trim();
      if (!sym) { ui.live[h.id] = { ok: false, msg: "Add a Yahoo ticker for this one first (under Name and delete)." }; continue; }
      const q = PRICES.quotes && PRICES.quotes[sym.toUpperCase()];
      if (!q) {
        try { await addTicker(sym); ui.live[h.id] = { ok: false, msg: sym + " has been added to the price list. Its price should be ready within a few minutes: press again then." }; }
        catch (e) { ui.live[h.id] = { ok: false, msg: "Couldn't add " + sym + " to the price list. Check the ticker." }; }
        continue;
      }
      h.currentPrice = q.price; h.priceDate = todayISO(); changed = true;
      ui.live[h.id] = { ok: true, msg: "Live: " + gbp(q.price) + (q.currency === "GBp" ? " (" + Number(q.raw).toLocaleString("en-GB") + "p)" : "") + " · Yahoo, " + quoteTime(q) };
    }
  } catch (e) {
    list.forEach(h => { ui.live[h.id] = { ok: false, msg: e.code === "token" ? "Access token problem: see Settings." : "Couldn't load prices just now. Try again, or type the price in." }; });
  }
  liveBusy = false;
  if (changed) save();
  render();
}

/* ---------- lock screen and first-time setup ---------- */
function gateHTML(mode, err) {
  const errHtml = err ? `<p class="neg" role="alert" style="margin:0">${esc(err)}</p>` : "";
  if (mode === "unlock") return `<div class="gate card stack">
    <h2>Unlock</h2>
    <p class="sub">Type your password. It unlocks your numbers on this device only.</p>
    <form id="unlockForm" class="stack">
      <label class="f">Password<input type="password" id="gPass" autocomplete="current-password" required autofocus></label>
      <label class="check"><input type="checkbox" id="gRemember" checked> Remember on this device</label>
      ${errHtml}
      <button class="primary" type="submit" id="btnUnlock">Unlock</button>
    </form>
    <p class="hint">Only tick "Remember" on your own phone or computer.</p>
  </div>`;
  if (mode === "loading") return `<div class="gate card"><p class="sub">${esc(err || "Loading…")}</p></div>`;
  if (mode === "claim") return `<div class="gate card stack">
    <h2>Create your login</h2>
    <p class="sub">Welcome. Type the invite code you were given, then choose your own password. Only you will know it.</p>
    <form id="claimForm" class="stack">
      <label class="f">Your name<input id="cName" required maxlength="20" placeholder="e.g. Sam"></label>
      <label class="f">Invite code<input type="password" id="cInvite" autocomplete="off" required></label>
      <label class="f">Choose a password (at least 8 characters)<input type="password" id="cPass" autocomplete="new-password" required minlength="8"></label>
      <label class="f">Type it again<input type="password" id="cPass2" autocomplete="new-password" required minlength="8"></label>
      <label class="check"><input type="checkbox" id="cRemember" checked> Remember on this device</label>
      ${errHtml}
      <button class="primary" type="submit" id="btnClaim">Create my login</button>
    </form>
    <p class="hint">Your numbers are locked with your password before they leave this device. Nobody else can read them, so if you forget the password the data can't be recovered. Write it down somewhere safe.</p>
  </div>`;
  if (mode === "invited") return `<div class="gate card stack">
    <h2>Invite ready</h2>
    <p class="sub">Send your mate this page's web address and the invite code you chose. When they open it, they'll pick their own password.</p>
  </div>`;
  return `<div class="gate card stack">
    <h2>Set up the tracker</h2>
    <p class="sub">One-time setup by the owner. Paste the GitHub access token, then choose an invite code to give your mate. They use it once to create their own password.</p>
    <form id="setupForm" class="stack">
      <label class="f">GitHub access token<input type="password" id="sToken" autocomplete="off" required placeholder="github_pat_…"></label>
      <label class="f">Invite code (at least 6 characters)<input type="password" id="sInvite" autocomplete="off" required minlength="6"></label>
      <label class="f">Type it again<input type="password" id="sInvite2" autocomplete="off" required minlength="6"></label>
      ${errHtml}
      <button class="primary" type="submit" id="btnSetup">Create invite</button>
    </form>
  </div>`;
}
function showGate(mode, err) { TOKEN = ""; renderWho(); $("#app").innerHTML = gateHTML(mode, err); }
async function unlock(pass, remember) {
  const token = await decryptJSON(CONFIG.token, pass);   // throws on a wrong passphrase
  PASS = pass; TOKEN = token;
  if (remember) lsSet("tw-pass", pass); else lsSet("tw-pass", null);
  try { const c = JSON.parse(lsGet("tw-cache") || "null"); if (c && c.HH && remember) { HH = c.HH; P = c.P || {}; Object.keys(P).forEach(id => P[id] = prepare(P[id])); } } catch (e) {}
  if (HH.people.length) { if (!ui.who || (ui.who !== "all" && !P[ui.who])) ui.who = HH.people[0].id; renderWho(); render(); }
  await pull();
  if (!HH.people.length) { showGate("loading", "Couldn't load the household data. Check your connection and reload."); return; }
  if (!ui.who || (ui.who !== "all" && !P[ui.who])) ui.who = HH.people[0].id;
  renderWho(); render();
}
document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "unlockForm") {
    e.preventDefault();
    const btn = $("#btnUnlock"); btn.disabled = true; btn.textContent = "Unlocking…";
    try { await unlock($("#gPass").value, $("#gRemember").checked); }
    catch (err) { showGate("unlock", err && err.code ? "Couldn't reach GitHub. Check your connection." : "That password didn't work. Try again."); }
  }
  if (f.id === "setupForm") {
    e.preventDefault();
    const token = $("#sToken").value.trim(), inv = $("#sInvite").value, inv2 = $("#sInvite2").value;
    if (inv !== inv2) { showGate("setup", "The two invite codes don't match."); return; }
    const btn = $("#btnSetup"); btn.disabled = true; btn.textContent = "Setting up…";
    try {
      const cur = await readFile(SITE_REPO, "config.json", token);
      if (cur) { showGate("setup", "This tracker is already set up. Reload the page."); return; }
      const cfg = { v: 1, owner: OWNER, dataRepo: DATA_REPO, invite: await encryptJSON(token, inv) };
      await writeFile(SITE_REPO, "config.json", JSON.stringify(cfg, null, 2) + "\n", undefined, "Create invite", token);
      showGate("invited");
    } catch (err) {
      const msg = err && err.code === "token" ? "GitHub didn't accept that token. Check you copied all of it." :
        err && err.code === "forbidden" ? "The token can't write to the trackerwhacker repo. Give it Contents: Read and write on trackerwhacker." :
        "Setup didn't finish. Check your connection and the token, then try again.";
      showGate("setup", msg);
    }
  }
  if (f.id === "claimForm") {
    e.preventDefault();
    const name = $("#cName").value.trim(), inv = $("#cInvite").value, pass = $("#cPass").value, pass2 = $("#cPass2").value, remember = $("#cRemember").checked;
    if (pass !== pass2) { showGate("claim", "The two passwords don't match."); return; }
    if (pass.length < 8) { showGate("claim", "Use at least 8 characters for your password."); return; }
    const btn = $("#btnClaim"); btn.disabled = true; btn.textContent = "Creating…";
    let token;
    try { token = await decryptJSON(CONFIG.invite, inv); }
    catch (err) { showGate("claim", "That invite code didn't work. Check it with whoever sent you the link."); return; }
    try {
      PASS = pass; TOKEN = token;
      HH = { people: [{ id: "a", name: name || "Me" }] };
      P = { a: freshPerson() };
      await writeEnc("household.json", HH);
      await writeEnc(personFile("a"), P.a);
      const cur = await readFile(SITE_REPO, "config.json", token);
      CONFIG = { v: 1, owner: OWNER, dataRepo: DATA_REPO, token: await encryptJSON(token, pass) };
      await writeFile(SITE_REPO, "config.json", JSON.stringify(CONFIG, null, 2) + "\n", cur && cur.sha, "Create login", token);
      if (remember) lsSet("tw-pass", pass);
      ui.who = "a"; lsSet("tw-who", "a"); cacheLocal();
      renderWho(); location.hash = "overview"; render(); toast("You're in. Your password unlocks this tracker from now on.");
    } catch (err) {
      TOKEN = ""; PASS = "";
      showGate("claim", err && (err.code === "token" || err.code === "forbidden") ? "The tracker's access token isn't working. Ask whoever sent you the link to check it." : "Couldn't finish. Check your connection and try again.");
    }
  }
}, true);

/* ---------- settings ---------- */
function viewSettings() {
  const updated = PRICES && PRICES.updated ? new Date(PRICES.updated).toLocaleString("en-GB") : "not checked yet";
  return `<div class="view-head"><div><h2>Settings</h2><p class="sub">Your name, this device, backups and the access token.</p></div></div>
  <div class="grid g2">
    <div class="card stack"><h3>Your name</h3>
      ${HH.people.map(p => `<label class="f">Name<input id="pname-${p.id}" data-pname="${p.id}" value="${esc(p.name)}" maxlength="20"></label>`).join("")}
      
    </div>
    <div class="card stack"><h3>This device</h3>
      <p class="hint" style="margin:0">${lsGet("tw-pass") ? "This device remembers your password." : "This device asks for your password each visit."}</p>
      <div><button data-act="lock" id="btnLock">Lock and forget on this device</button></div>
      <p class="hint" style="margin:0">Use this on a shared or borrowed device when you're done.</p>
    </div>
    <div class="card stack"><h3>Backups</h3>
      <div class="row"><button data-act="backup" id="btnBackup">Download backup</button>
      <label class="btn" for="restoreFile" style="flex:0 0 auto">Restore from backup</label><input type="file" id="restoreFile" accept="application/json,.json" hidden></div>
      <p class="hint" style="margin:0">The backup file is not locked with your password, so keep it somewhere private.</p>
    </div>
    <div class="card stack"><h3>Access token</h3>
      ${tokenProblem ? '<p class="neg" style="margin:0">GitHub stopped accepting the current token (it may have expired). Make a new one with the same settings and paste it here.</p>' : '<p class="hint" style="margin:0">Replace it when it expires. GitHub emails you a week before.</p>'}
      <form id="tokenForm" class="row">
        <label class="f">New access token<input type="password" id="newToken" autocomplete="off" placeholder="github_pat_…"></label>
        <button class="primary" type="submit" id="btnToken">Replace</button>
      </form>
    </div>
    <div class="card stack span2"><h3>Live prices</h3>
      <p class="hint" style="margin:0">GitHub fetches prices from Yahoo Finance every 30 minutes on weekdays, 7am–6pm UK time. Last fetched: <b>${esc(updated)}</b>.</p>
      <div><button data-act="check-prices" id="btnCheckPrices">Check now</button></div>
    </div>
  </div>`;
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.pname) { const p = HH.people.find(p => p.id === t.dataset.pname); if (p) { p.name = t.value.trim() || p.name; saveHousehold(); renderWho(); } }
  if (t.id === "restoreFile" && t.files && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        if (!j.HH || !j.P) throw new Error("bad");
        HH = j.HH; P = {}; Object.keys(j.P).forEach(id => P[id] = prepare(j.P[id]));
        dirty.__hh = true; HH.people.forEach(p => dirty[p.id] = true);
        if (!P[ui.who] && ui.who !== "all") ui.who = HH.people[0].id;
        flushAll(); renderWho(); render(); toast("Backup restored");
      } catch (err) { toast("That file isn't a tracker backup"); }
    };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "lock") { lsSet("tw-pass", null); lsSet("tw-cache", null); location.reload(); }
  if (act === "backup") {
    const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), HH, P }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "trackerwhacker-backup-" + todayISO() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  if (act === "check-prices") { try { await loadPrices(); render(); toast("Prices checked"); } catch (err) { toast("Couldn't reach GitHub"); } }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "tokenForm") return;
  e.preventDefault();
  const token = $("#newToken").value.trim(); if (!token) return;
  try {
    await readFile(DATA_REPO, "household.json", token);
    CONFIG = { ...CONFIG, token: await encryptJSON(token, PASS) };
    const cur = await readFile(SITE_REPO, "config.json", token);
    await writeFile(SITE_REPO, "config.json", JSON.stringify(CONFIG, null, 2) + "\n", cur && cur.sha, "Replace access token", token);
    TOKEN = token; tokenProblem = false; render(); toast("Access token replaced");
  } catch (err) { toast(err && err.code === "token" ? "GitHub didn't accept that token" : "Couldn't save the new token. Check its permissions."); }
}, true);

/* ---------- start ---------- */
(async function boot() {
  renderWho();
  showGate("loading", "Loading…");
  CONFIG = await loadConfig();
  if (!CONFIG) { showGate("setup"); return; }
  if (!CONFIG.token) { showGate("claim"); return; }
  const remembered = lsGet("tw-pass");
  if (remembered) {
    try { await unlock(remembered, true); loadPrices().catch(() => {}); return; }
    catch (e) { lsSet("tw-pass", null); }
  }
  showGate("unlock");
})();
window.addEventListener("hashchange", () => { if (TOKEN) route(); });
})();
</script>
